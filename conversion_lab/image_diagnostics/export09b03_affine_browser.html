<!doctype html><meta charset="utf-8"><title>Original MLX weight conversion check</title>
<style>body{font:16px system-ui;margin:3rem;max-width:900px;background:#f4f7fa;color:#162b38}button{padding:1rem;background:#176958;color:white;border:0;border-radius:8px}pre{white-space:pre-wrap;padding:1.5rem;background:white;border-radius:12px}</style>
<h1>Original MLX weight conversion check</h1><p>One actual trained projection. This compares the original compressed weights and separate adapter in Chrome WebGPU against an MLX control at matched precision. It is not the complete solver.</p>
<button id="run">Run comparison</button><pre id="result">Ready</pre>
<script type="module">
import * as ort from './runtime/ort.webgpu.min.mjs';
ort.env.wasm.wasmPaths=new URL('./runtime/',location.href).href;
const output=document.querySelector('#result');
async function data(name){const r=await fetch(name+'.f32');if(!r.ok)throw Error(name);return new Float32Array(await r.arrayBuffer())}
function error(a,b){let d=0,n=0,max=0;for(let i=0;i<a.length;i++){let e=a[i]-b[i];d+=e*e;n+=b[i]*b[i];max=Math.max(max,Math.abs(e))}return {relative_l2:Math.sqrt(d/n),max_abs:max}}
document.querySelector('#run').onclick=async()=>{let s,input,results;const t=performance.now();output.textContent='Loading and running…';try{
 const dims=await(await fetch('./browser-fixture.json')).json();const x=await data('input');const ref=await data('mlx_base');const adapted=await data('mlx_plus_adapter');
 s=await ort.InferenceSession.create('./projection.onnx',{executionProviders:['webgpu']});input=new ort.Tensor('float32',x,dims.input);results=await s.run({x:input});
 const baseError=error(results.base.data,ref),adapterError=error(results.adapted.data,adapted);output.textContent=JSON.stringify({status:'complete',base_error:baseError,adapter_error:adapterError,passed:baseError.relative_l2<0.0001&&adapterError.relative_l2<0.0001,seconds:(performance.now()-t)/1000,scope:'one real projection; not full-model parity'},null,2);
}catch(e){output.textContent=JSON.stringify({status:'failed',error:String(e)},null,2)}finally{input?.dispose();if(results)for(const t of Object.values(results))t.dispose();if(s)await s.release()}};
</script>
